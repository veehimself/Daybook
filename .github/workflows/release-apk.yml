name: Build release APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a GitHub Release on tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      # No gradle wrapper is committed, so the action provisions Gradle itself (and caches it).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          S_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          S_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "KEYSTORE_PASSWORD=$S_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$S_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$S_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets found - generating a throwaway key (fine for testing, not for updates)."
            keytool -genkeypair -keystore "$KS" -alias daybook -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass daybook-ci -keypass daybook-ci -dname "CN=Daybook CI"
            echo "KEYSTORE_PASSWORD=daybook-ci" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=daybook" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=daybook-ci" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build optimised release APK (R8 + resource shrinking)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/daybook-${GITHUB_REF_NAME//\//-}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: daybook-release-apk
          path: dist/*.apk
          if-no-files-found: error

      # Keep the R8 mapping so crash stack traces can be de-obfuscated later.
      - uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
